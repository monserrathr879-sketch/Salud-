<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6dd5ed, #2193b0); /* Fondo degradado bonito */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        form {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #1a5276;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }
        .campo {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #34495e;
            font-size: 15px;
        }
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d0e8f2;
            border-radius: 12px;
            font-size: 16px;
            background-color: #f8fcff;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus,
        select:focus {
            border-color: #2193b0;
            outline: none;
            background-color: #fff;
        }
        /* Estilo para la barra de dolor */
        .rango-container {
            display: flex;
            align-items: center;
            background: #f0f8ff;
            padding: 10px;
            border-radius: 12px;
        }
        input[type="range"] {
            flex-grow: 1;
            height: 8px;
            accent-color: #2193b0;
        }
        #valorDolor {
            min-width: 40px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-left: 15px;
            background: white;
            padding: 5px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #2193b0, #6dd5ed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(33, 147, 176, 0.4);
        }

        /* ESTILO PARA LA FRASE MOTIVACIONAL */
        #frase {
            margin-top: 20px;
            padding: 18px;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            border-radius: 12px;
            font-style: italic;
            color: #1e7e34;
            text-align: center;
            display: none;
            font-weight: 500;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<form id="formSalud" action="#" method="post">
    <h2>📋 Encuesta de Salud</h2>

    <div class="campo">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" max="120" required placeholder="Ingresa tu edad">
    </div>

    <div class="campo">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" min="1" max="300" step="0.1" required placeholder="Ej: 75.5">
    </div>

    <div class="campo">
        <label for="estatura">Estatura (cm):</label>
        <input type="number" id="estatura" name="estatura" min="50" max="250" required placeholder="Ej: 175">
    </div>

    <div class="campo">
        <label>Nivel de dolor actual:</label>
        <div class="rango-container">
            <input type="range" id="dolor" name="dolor" min="0" max="10" value="0" oninput="actualizarValor(this.value)">
            <span id="valorDolor">0</span>
        </div>
        <small style="color: #7f8c8d; margin-top: 5px; display: block;">(0 = Sin dolor, 10 = Dolor máximo)</small>
    </div>

    <div class="campo">
        <label for="sangre">Tipo de sangre:</label>
        <select id="sangre" name="sangre" required>
            <option value="">Selecciona una opción</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
    </div>

    <button type="submit">Enviar Encuesta</button>

    <div id="frase"></div>

</form>

<script>
    function actualizarValor(valor) {
        document.getElementById('valorDolor').textContent = valor;
    }

    const frases = [
        "¡Tu cuerpo es tu templo, cuídalo y ámalo siempre! 💖",
        "La salud es lo más importante, nunca dejes de cuidarte. ✨",
        "¡Ánimo! Cada día es una nueva oportunidad para sentirte mejor. 💪",
        "Escucha a tu cuerpo, él sabe lo que necesita. 🧘‍♂️",
        "¡Eres más fuerte de lo que crees y capaz de todo! 🚀",
        "El cuidado personal no es un gasto, es la mejor inversión. 🌱",
        "Sonríe, tu salud te lo agradecerá y tu vida mejorará. 😊"
    ];

    document.getElementById('formSalud').addEventListener('submit', function(e) {
        e.preventDefault();
        const indice = Math.floor(Math.random() * frases.length);
        const elementoFrase = document.getElementById('frase');
        elementoFrase.textContent = frases[indice];
        elementoFrase.style.display = "block";
    });
</script>

</body>
</html>
